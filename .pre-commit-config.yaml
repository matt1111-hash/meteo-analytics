# =============================================================================
# PRE-COMMIT - Merged Edition v3.2
# =============================================================================

default_language_version:
  python: python3.12

repos:
  # ---------------------------------------------------------------------------
  # BASICS
  # ---------------------------------------------------------------------------
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-added-large-files
        args: ['--maxkb=500']
      - id: debug-statements
      - id: detect-private-key

  # ---------------------------------------------------------------------------
  # RUFF - Lint + Format
  # FIXED: verzió szinkronban a requirements-szel (>=0.8.0)
  # ---------------------------------------------------------------------------
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.6
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  # ---------------------------------------------------------------------------
  # MYPY
  # ---------------------------------------------------------------------------
  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: >-
          bash -c 'for d in src app lib; do
            if [ -d "$d" ] && find "$d" -name "*.py" -type f 2>/dev/null | grep -q .; then
              SRC="$d";
              break;
            fi;
          done;
          if [ -z "${SRC:-}" ] && compgen -G "*.py" >/dev/null 2>&1; then
            SRC=".";
          fi;
          if [ -z "${SRC:-}" ]; then
            echo "No Python source found - mypy skipped";
            exit 0;
          fi;
          if [ -x venv/bin/python ]; then
            exec venv/bin/python -m mypy "$SRC" --ignore-missing-imports;
          elif [ -x .venv/bin/python ]; then
            exec .venv/bin/python -m mypy "$SRC" --ignore-missing-imports;
          elif command -v python >/dev/null 2>&1; then
            exec python -m mypy "$SRC" --ignore-missing-imports;
          else
            echo "python not found for mypy";
            exit 1;
          fi'
        language: system
        pass_filenames: false

  # ---------------------------------------------------------------------------
  # ARCHITECTURE (ha van .importlinter)
  # ---------------------------------------------------------------------------
  - repo: local
    hooks:
      - id: import-linter
        name: architecture check
        entry: >-
          bash -c 'if [ ! -f .importlinter ]; then
            echo "No .importlinter - skipped";
            exit 0;
          fi;
          if grep -Eq "^[[:space:]]*root_package[[:space:]]*=[[:space:]]*src[[:space:]]*$" .importlinter &&
             [ ! -f src/__init__.py ]; then
            echo "Template .importlinter detected - customize root_package before enabling import-linter";
            exit 0;
          fi;
          if [ -x venv/bin/lint-imports ]; then
            exec venv/bin/lint-imports;
          elif [ -x .venv/bin/lint-imports ]; then
            exec .venv/bin/lint-imports;
          elif command -v lint-imports >/dev/null 2>&1; then
            exec lint-imports;
          else
            echo "lint-imports not installed (pip install -r requirements-dev.txt)";
            exit 1;
          fi'
        language: system
        pass_filenames: false
        always_run: true

  # ---------------------------------------------------------------------------
  # COMPLEXITY
  # FIXED: dinamikus src detekció
  # ---------------------------------------------------------------------------
  - repo: local
    hooks:
      - id: complexity
        name: complexity check
        entry: >-
          bash -c 'SRC=$(for d in src app lib; do [ -d "$d" ] && echo "$d" && break; done);
          command -v radon >/dev/null &&
          radon cc "${SRC:-.}" -e "tests/*,venv/*,.venv/*,__pycache__/*" -a -nc || true'
        language: system
        pass_filenames: false
        types: [python]

  # ---------------------------------------------------------------------------
  # QUICK TEST
  # ---------------------------------------------------------------------------
  - repo: local
    hooks:
      - id: pytest
        name: quick test
        entry: >-
          bash -c 'for d in src app lib; do
            if [ -d "$d" ] && find "$d" -name "*.py" -type f 2>/dev/null | grep -q .; then
              SRC="$d";
              break;
            fi;
          done;
          if [ -z "${SRC:-}" ] && compgen -G "*.py" >/dev/null 2>&1; then
            SRC=".";
          fi;
          export PYTHONPATH="${SRC:-}${PYTHONPATH:+:$PYTHONPATH}";
          if [ -x venv/bin/pytest ]; then
            exec venv/bin/pytest -x -q --no-cov -m "not slow";
          elif [ -x .venv/bin/pytest ]; then
            exec .venv/bin/pytest -x -q --no-cov -m "not slow";
          elif command -v pytest >/dev/null 2>&1; then
            exec pytest -x -q --no-cov -m "not slow";
          else
            echo "pytest not installed (pip install -r requirements-dev.txt)";
            exit 1;
          fi'
        language: system
        pass_filenames: false
        stages: [pre-commit]

  # ---------------------------------------------------------------------------
  # SECRETS
  # FIXED: baseline hiányában nem blokkolja az első commitot
  # ---------------------------------------------------------------------------
  - repo: local
    hooks:
      - id: detect-secrets
        name: detect secrets
        entry: >-
          bash -c 'if [ ! -f .secrets.baseline ]; then
            echo "No .secrets.baseline - skipped (run detect-secrets scan > .secrets.baseline)";
            exit 0;
          fi;
          if [ -x venv/bin/detect-secrets-hook ]; then
            exec venv/bin/detect-secrets-hook --baseline .secrets.baseline "$@";
          elif [ -x .venv/bin/detect-secrets-hook ]; then
            exec .venv/bin/detect-secrets-hook --baseline .secrets.baseline "$@";
          elif command -v detect-secrets-hook >/dev/null 2>&1; then
            exec detect-secrets-hook --baseline .secrets.baseline "$@";
          else
            echo "detect-secrets not installed (pip install -r requirements-dev.txt)";
            exit 1;
          fi' --
        language: system
        exclude: package.lock.json
        stages: [pre-commit]
