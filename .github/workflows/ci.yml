name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .[dev]
          pip install pytest-timeout

      - name: Ruff check
        run: python -m ruff check src/

      - name: Test + Coverage
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: |
          python -m pytest tests/ -p pytest_cov.plugin -p pytest_timeout -p anyio.pytest_plugin -p pytest_asyncio.plugin -p pytest_mock --cov=src --cov-config=.coveragerc -q --timeout=10 --ignore=tests/gui
