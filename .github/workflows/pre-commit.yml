name: Pre-commit

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  pre-commit:
    runs-on: ubuntu-latest

    steps:
    - name: 📥 Checkout
      uses: actions/checkout@v4

    - name: 🐍 Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'

    - name: 📦 Install pre-commit and dev dependencies
      run: |
        sudo apt-get update && sudo apt-get install -y libegl1-mesa libopengl0
        python -m pip install --upgrade pip
        pip install pre-commit
        pip install -r requirements.txt
        pip install -r requirements-dev.txt
        pip install pytest pytest-cov mypy detect-secrets ruff radon bandit[toml] import-linter

    - name: 🔧 Run pre-commit
      uses: pre-commit/action@v3.0.0
