name: E2E Tests

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  e2e-tests:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox]

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.lock

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock
          pip install uvicorn[standard] fastapi

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Install E2E test dependencies
        working-directory: ./tests/e2e
        run: npm install

      - name: Install Playwright browsers
        working-directory: ./tests/e2e
        run: npx playwright install --with-deps ${{ matrix.browser }}

      - name: Start dev stack
        run: |
          ./scripts/dev.sh > /tmp/dev.log 2>&1 &
          DEV_PID=$!
          for _ in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:8003/health >/dev/null 2>&1 && \
               curl -fsS http://127.0.0.1:5174 >/dev/null 2>&1; then
              echo "Dev stack ready"
              exit 0
            fi
            if ! kill -0 "$DEV_PID" 2>/dev/null; then
              echo "ERROR: dev.sh exited unexpectedly"
              cat /tmp/dev.log
              exit 1
            fi
            sleep 2
          done
          echo "ERROR: timeout waiting for dev stack"
          cat /tmp/dev.log
          exit 1

      - name: Run E2E tests (${{ matrix.browser }})
        working-directory: ./tests/e2e
        env:
          CI: true
        run: npx playwright test --project=${{ matrix.browser }}

      - name: Upload E2E report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-report-${{ matrix.browser }}
          path: tests/e2e/playwright-report/
          retention-days: 30

      - name: Upload screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-screenshots-${{ matrix.browser }}
          path: tests/e2e/test-results/
          retention-days: 7

  e2e-summary:
    runs-on: ubuntu-latest
    needs: e2e-tests
    if: always()

    steps:
      - name: Summary
        run: |
          echo "## E2E Test Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Browser | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Chromium | ${{ needs.e2e-tests.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Firefox | ${{ needs.e2e-tests.result }} |" >> $GITHUB_STEP_SUMMARY
