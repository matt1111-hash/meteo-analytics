name: Health Check

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: "0 9 * * MON"
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  health-check:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.12", "3.13"]

    permissions:
      contents: read
      pull-requests: write
      issues: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Ruff check
        run: ruff check src tests --output-format=github

      - name: Mypy
        run: mypy src --ignore-missing-imports

      - name: Test + Coverage
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: |
          python -m pytest tests/ -p pytest_cov.plugin -p pytest_timeout -p anyio.pytest_plugin -p pytest_asyncio.plugin --cov=src --cov-config=.coveragerc -q --timeout=10 --ignore=tests/gui --cov-report=term:skip-covered --cov-report=xml:coverage.xml

      - name: Security scan (bandit)
        run: |
          bandit -r src -f json -o bandit-report.json || true
          bandit -r src -ll || true

      - name: Upload coverage
        if: matrix.python-version == '3.12'
        uses: codecov/codecov-action@v6
        with:
          files: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

      - name: Save artifacts
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: health-reports
          path: |
            coverage.xml
            bandit-report.json
          retention-days: 30

  health-summary:
    runs-on: ubuntu-latest
    needs: health-check
    if: always()

    steps:
      - name: Summary
        run: |
          echo "## Health Check Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Python | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| 3.12 | ${{ needs.health-check.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 3.13 | ${{ needs.health-check.result }} |" >> $GITHUB_STEP_SUMMARY
